spring.application.name=tigo-backend
spring.datasource.url=${NEON_JDBC_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${NEON_DB_USERNAME}
spring.datasource.password=${NEON_DB_PASSWORD}
# NEON_JDBC_URL points at Neon's pooled (PgBouncer transaction-mode) endpoint, which does not
# safely support server-side named prepared statements shared across pooled connections; disable
# them or parameter types/plans can get cross-contaminated between unrelated queries.
spring.datasource.hikari.data-source-properties.prepareThreshold=0
# prepareThreshold=0 alone still uses the extended query protocol (Parse/Bind/Describe), which
# PgBouncer transaction-mode can still corrupt parameter type resolution for (e.g. lower(?)
# resolving to lower(bytea)). Force true simple-query protocol so parameters are inlined as text.
spring.datasource.hikari.data-source-properties.preferQueryMode=simple
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
# Disable open-in-view: this is a stateless REST API, not a server-rendered view layer, so
# holding a DB connection/session open through view rendering has no benefit and only risks
# connection pool exhaustion and masking N+1 lazy-loading issues.
spring.jpa.open-in-view=false
# Cap client-controlled page size (Pageable is bound directly from request query params) to
# prevent a client from requesting an excessively large page and causing resource exhaustion.
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.default-page-size=20
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://ep-small-dew-asbun3wu.neonauth.c-4.eu-central-1.aws.neon.tech/neondb/auth/.well-known/jwks.json
# Overrides the issuer used for JWT "iss" claim validation. Leave blank to derive it from
# jwk-set-uri (strip "/.well-known/jwks.json"). Set AUTH_ISSUER_URI if Neon Auth's actual
# token issuer differs from that derived value.
app.auth.issuer-uri=${AUTH_ISSUER_URI:}
server.port=${PORT:8081}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}