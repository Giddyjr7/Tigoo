spring.application.name=tigo-backend
spring.datasource.url=${NEON_JDBC_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${NEON_DB_USERNAME}
spring.datasource.password=${NEON_DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://ep-small-dew-asbun3wu.neonauth.c-4.eu-central-1.aws.neon.tech/neondb/auth/.well-known/jwks.json
# Overrides the issuer used for JWT "iss" claim validation. Leave blank to derive it from
# jwk-set-uri (strip "/.well-known/jwks.json"). Set AUTH_ISSUER_URI if Neon Auth's actual
# token issuer differs from that derived value.
app.auth.issuer-uri=${AUTH_ISSUER_URI:}
server.port=${PORT:8081}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}